<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RTRS - Passenger Login</title>
</head>
<body>
    <h1>Railway Ticket Reservation System (RTRS)</h1>
    <form action="/login" method="post">
        <label for="identifier">Email / Mobile Number</label>
        <input type="text" id="identifier" name="identifier">
        <label for="password">Password</label>
        <input type="password" id="password" name="password">
        <button type="submit">Sign In</button>
    </form>
</body>
</html>
